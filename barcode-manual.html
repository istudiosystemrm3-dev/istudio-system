<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิมพ์บาร์โค้ดสินค้า (Manual) - iServe</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .container { max-width: 1300px; display: grid; grid-template-columns: 1fr 2.5fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        input[type="range"] { width: 100%; box-sizing: border-box; outline: none; }
        .btn-print { background-color: #0071e3; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 10px; }
        .btn-print:hover { background-color: #005bb5; }
        
        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; border-color: #0071e3; background-color: #f5f5f7; padding: 12px; font-size: 15px; border: 1px solid #d2d2d7; border-radius: 6px; box-sizing: border-box; outline: none; }
        .filter-section { background: #f5f5f7; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; max-height: 1200px; overflow-y: auto; padding: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; background: white; padding: 6px 12px; border-radius: 6px; border: 1px solid #d2d2d7; font-size: 13px; cursor: pointer; user-select: none; }
        .checkbox-label input { margin: 0; width: 16px; height: 16px; }
        .checkbox-label:hover { border-color: #0071e3; background-color: #f0f7ff; }
        .shortcut-btns { margin-bottom: 8px; }
        .btn-link { background: none; border: none; color: #0071e3; cursor: pointer; font-size: 12px; padding: 0; margin-right: 15px; font-weight: 500; text-decoration: underline; }
        
        .btn-delete { background-color: #ff3b30; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background-color: #ff9500; color: white; }
        .status-connected { background-color: #34c759; }

        .filter-highlight { display: flex; align-items: center; gap: 8px; background: #e8f2fc; padding: 8px 12px; border-radius: 8px; border: 1px solid #c8e1fa; font-size: 13px; font-weight: bold; color: #0071e3; cursor: pointer; transition: 0.2s; }
        .filter-highlight:hover { background: #d0e7ff; }
        .filter-highlight input { width: 18px; height: 18px; cursor: pointer; }

        #printArea { display: none; }

        /* 🌟 รวมสไตล์ทั้งแบบตาราง และแบบ Grid เข้าด้วยกัน สำหรับตอนปริ้น */
        @media print { 
            body { background: white; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            .navbar, .container { display: none !important; } 
            
            #printArea { display: block; visibility: visible; position: absolute; left: 0; top: 0; width: 100%; padding: 5mm; box-sizing: border-box; }
            
            /* --- สไตล์สำหรับแบบตาราง (Table) --- */
            .print-table { width: 100%; border-collapse: collapse; color: #000; }
            .print-table td { border: 1px solid #000; padding: 8px 10px; vertical-align: middle; }
            .col-1-barcode { text-align: center; width: 25%; padding: 5px 0 !important; }
            .col-2-code { text-align: center; width: 15%; font-size: 15px; }
            .col-3-desc { text-align: left; width: 45%; font-size: 15px; }
            .col-4-price { text-align: right; width: 15%; font-size: 15px; }
            .col-1-barcode svg { max-width: 100%; height: auto; display: block; margin: 0 auto; shape-rendering: crispEdges; } 

            /* --- สไตล์สำหรับแบบการ์ดประหยัดกระดาษ (Grid) --- */
            .print-grid { display: grid; gap: 4mm; }
            .cols-1 { grid-template-columns: 1fr; }
            .cols-2 { grid-template-columns: repeat(2, 1fr); }
            .cols-3 { grid-template-columns: repeat(3, 1fr); }
            .cols-4 { grid-template-columns: repeat(4, 1fr); }
            
            .print-card { border: 1px solid #000; padding: 3mm; border-radius: 4px; text-align: center; page-break-inside: avoid; display: flex; flex-direction: column; justify-content: center; align-items: center; }
            .print-card svg { max-width: 100%; height: auto; display: block; margin: 0 auto; shape-rendering: crispEdges; } 
            .print-desc { font-size: 11px; margin-top: 3px; line-height: 1.2; word-wrap: break-word; color: #000; }
            .print-price { font-size: 13px; font-weight: bold; margin-top: 3px; color: #000; }
            
            @page { margin: 10mm; } 
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <script src="navbar.js"></script>
    <div class="container no-print">
        
        <div>
            <div class="card">
                <h2>☁️ สถานะฐานข้อมูลบาร์โค้ด</h2>
                <div style="margin-bottom: 15px;">
                    สถานะระบบ: <span id="syncStatus" class="status-badge">กำลังเตรียมข้อมูล...</span>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; background: #f5f5f7; padding: 12px 15px; border-radius: 8px; border: 1px solid #d2d2d7;">
                    <div style="font-size: 13px; color: #515154;">
                        <strong>🕒 ข้อมูลอัปเดตเมื่อ:</strong> <span id="lastUpdateText" style="color: #0071e3; font-weight: bold;">-</span><br>
                        <span style="font-size: 11px; color: #86868b;">(ดึงใหม่อัตโนมัติวันละ 1 ครั้ง)</span>
                    </div>
                    <button onclick="forceRefresh()" style="background: #1d1d1f; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;">🔄 รีเฟรช</button>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ ตั้งค่าก่อนพิมพ์</h2>
                <div class="flex-group form-group">
                    <div class="flex-item">
                        <label>ความหนาเส้น: <span id="widthVal">1.5</span></label>
                        <input type="range" id="barWidth" min="1" max="3" step="0.5" value="1.5" oninput="updateSettings()">
                    </div>
                    <div class="flex-item">
                        <label>ความสูงบาร์โค้ด: <span id="heightVal">40</span>px</label>
                        <input type="range" id="barHeight" min="30" max="80" value="40" oninput="updateSettings()">
                    </div>
                    <div class="flex-item">
                        <label>ขนาดอักษร: <span id="fontVal">12</span>px</label>
                        <input type="range" id="fontSize" min="10" max="20" value="12" oninput="updateSettings()">
                    </div>
                </div>
                
                <!-- 🌟 ตัวเลือกเลย์เอาต์ (เพิ่มแบบตาราง) -->
                <div class="form-group">
                    <label>รูปแบบการจัดเรียงกระดาษ:</label>
                    <select id="printColumns" onchange="updateSettings()" style="width: 100%; padding: 8px; border: 1px solid #d2d2d7; border-radius: 6px; font-size: 14px; outline: none; background-color: #fff9e6;">
                        <option value="table">📄 แบบตารางดั้งเดิม (รายละเอียดครบแยกช่อง)</option>
                        <option value="1">📦 แบบการ์ด: 1 ดวง / แถว</option>
                        <option value="2">📦 แบบการ์ด: 2 ดวง / แถว</option>
                        <option value="3" selected>📦 แบบการ์ด: 3 ดวง / แถว (แนะนำ - ประหยัดกระดาษ)</option>
                        <option value="4">📦 แบบการ์ด: 4 ดวง / แถว</option>
                    </select>
                </div>
                <button class="btn-print" onclick="window.print()">🖨️ สั่งพิมพ์เฉพาะรายการที่เลือก</button>
            </div>
        </div>

        <div class="card">
            <h2>📋 รายการบาร์โค้ดและระบบกรองพิมพ์ (<span id="totalItems">0</span>)</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 พิมพ์เพื่อค้นหาพาร์ท: รหัส, รายละเอียด, รุ่น..." onkeyup="renderTable()" autofocus>
            </div>

            <div class="filter-section">
                <label style="color: #1d1d1f; font-size: 13px;">เลือกหมวดหมู่ที่ต้องการแสดง:</label>
                <div class="shortcut-btns">
                    <button class="btn-link" onclick="toggleAllCheckboxes(true)">✓ เลือกทั้งหมด</button>
                    <button class="btn-link" onclick="toggleAllCheckboxes(false)">✕ ล้างทั้งหมด</button>
                </div>
                <div id="categoryCheckboxes" class="checkbox-group"></div>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                <label class="filter-highlight">
                    <input type="checkbox" id="showOnlySelected" onchange="renderTable()">
                    👁️ แสดงเฉพาะรายการที่เลือกพิมพ์
                </label>
            </div>

            <div style="overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #e5e5e7; border-radius: 6px;">
                <table>
                    <thead style="position: sticky; top: 0; z-index: 1;">
                        <tr>
                            <th width="8%" style="text-align: center;">
                                พิมพ์?<br>
                                <input type="checkbox" id="masterCheckbox" checked onclick="toggleAllPrintRows(this.checked)" style="width:16px; height:16px; cursor:pointer;">
                            </th>
                            <th width="12%">Code</th>
                            <th width="32%">Description</th>
                            <th width="12%">Model</th>
                            <th width="12%">Categories</th>
                            <th width="12%" style="text-align: right;">Price</th>
                            <th width="6%" style="text-align: center;">ลบ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" style="text-align: center; padding: 30px; color:#86868b;">กำลังโหลดจากชีต...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="printArea"></div>

    <script>
        const CACHE_KEY_BARCODE = 'iserve_barcode_data';
        const CACHE_TIME_KEY_BARCODE = 'iserve_barcode_time';
        const CACHE_DURATION_BARCODE = 24 * 60 * 60 * 1000; 

        let barcodeData = [];

        window.onload = function() { loadData(false); };

        function processData(data) {
            barcodeData = data.map(item => ({ ...item, _printSelected: true }));
            
            let statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "พร้อมใช้งาน (มีข้อมูลแล้ว)";
            statusEl.className = "status-badge status-connected";
            
            let cacheTime = localStorage.getItem(CACHE_TIME_KEY_BARCODE);
            if (cacheTime) {
                let d = new Date(parseInt(cacheTime));
                document.getElementById('lastUpdateText').innerText = d.toLocaleString('th-TH');
            }

            updateCategorySelection();
            renderTable();
        }

        function loadData(forceUpdate = false) {
            if (!forceUpdate) {
                let cachedData = localStorage.getItem(CACHE_KEY_BARCODE);
                let cacheTime = localStorage.getItem(CACHE_TIME_KEY_BARCODE);
                let now = new Date().getTime();

                if (cachedData && cacheTime && (now - cacheTime < CACHE_DURATION_BARCODE)) {
                    try {
                        let parsedData = JSON.parse(cachedData);
                        processData(parsedData);
                        return; 
                    } catch (e) {
                        console.log("Cache มีปัญหา ดึงข้อมูลใหม่...");
                    }
                }
            }

            let statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "กำลังดาวน์โหลดบาร์โค้ดใหม่...";
            statusEl.className = "status-badge";
            statusEl.style.backgroundColor = "#ff9500";
            
            let url = typeof window.WEB_APP_URL !== 'undefined' ? window.WEB_APP_URL : WEB_APP_URL;

            fetch(url + "?action=getBarcodes", { redirect: 'follow' })
                .then(res => res.json())
                .then(data => {
                    localStorage.setItem(CACHE_KEY_BARCODE, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY_BARCODE, new Date().getTime().toString());
                    processData(data);
                }).catch(err => {
                    statusEl.innerText = "เชื่อมต่อล้มเหลว (ลองกดรีเฟรชใหม่)";
                    statusEl.style.backgroundColor = "#ff3b30";
                });
        }

        function forceRefresh() {
            localStorage.removeItem(CACHE_KEY_BARCODE);
            localStorage.removeItem(CACHE_TIME_KEY_BARCODE);
            loadData(true);
        }

        function updateCategorySelection() {
            let cats = [...new Set(barcodeData.map(i => String(i.category || "ทั่วไป").trim()))].sort();
            let container = document.getElementById('categoryCheckboxes');
            
            let currentChecked = Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value);
            let isFirstLoad = container.innerHTML.trim() === "";

            container.innerHTML = cats.map((cat) => {
                let isChecked = isFirstLoad ? "checked" : (currentChecked.includes(cat) ? "checked" : "");
                return `
                <label class="checkbox-label">
                    <input type="checkbox" class="cat-checkbox" value="${cat}" ${isChecked} onchange="renderTable()">
                    ${cat}
                </label>
                `;
            }).join('');
        }

        function toggleAllCheckboxes(status) {
            let checkboxes = document.querySelectorAll('.cat-checkbox');
            checkboxes.forEach(cb => cb.checked = status);
            renderTable();
        }

        function getDevicePriority(item) {
            let str = (String(item.category || "") + " " + String(item.desc || "") + " " + String(item.model || "")).toLowerCase();
            if (str.includes("iphone")) return 1;
            if (str.includes("ipad")) return 2;
            if (str.includes("apple watch") || str.includes("watch")) return 3;
            return 4;
        }

        function renderTable() {
            let keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            let keywordsArray = keyword.split(" ").filter(k => k.trim() !== "");
            
            let checkedCats = [];
            document.querySelectorAll('.cat-checkbox:checked').forEach(cb => checkedCats.push(cb.value));

            let showOnlySelected = document.getElementById('showOnlySelected').checked;

            let displayData = barcodeData;

            if (keywordsArray.length > 0) {
                displayData = displayData.filter(item => {
                    let combinedText = (String(item.code || "") + " " + String(item.desc || "") + " " + String(item.model || "") + " " + String(item.category || "")).toLowerCase();
                    return keywordsArray.every(k => combinedText.includes(k));
                });
            }

            displayData = displayData.filter(item => checkedCats.includes(String(item.category || "ทั่วไป").trim()));

            if (showOnlySelected) {
                displayData = displayData.filter(item => item._printSelected);
            }

            displayData.sort((a, b) => {
                let priorityA = getDevicePriority(a);
                let priorityB = getDevicePriority(b);
                if (priorityA !== priorityB) return priorityA - priorityB;
                
                let descA = String(a.desc || "");
                let descB = String(b.desc || "");
                return descA.localeCompare(descB, 'th'); 
            });
            
            document.getElementById('totalItems').innerText = displayData.length.toLocaleString();
            
            let allSelected = displayData.length > 0 && displayData.every(item => item._printSelected);
            document.getElementById('masterCheckbox').checked = allSelected;
            
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            if(displayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 30px; color:#86868b;">ไม่พบข้อมูลรายการที่ตรงกับเงื่อนไข</td></tr>`;
            } else {
                displayData.forEach((item, index) => {
                    let isChecked = item._printSelected ? "checked" : "";
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="text-align: center;">
                            <input type="checkbox" class="print-row-cb" data-code="${item.code}" ${isChecked} onchange="togglePrintRow('${item.code}', ${index}, this.checked)" style="width:16px; height:16px; cursor:pointer;">
                        </td>
                        <td style="font-weight:bold; color:#515154;">${item.code || "-"}</td>
                        <td style="color:#1d1d1f; font-weight:500;">${item.desc || "-"}</td>
                        <td><span class="badge" style="background:#f4e6fa; color:#8a2be2;">${item.model || "-"}</span></td>
                        <td><span class="badge">${item.category || "-"}</span></td>
                        <td style="text-align: right; color:#ff3b30; font-weight:bold;">${item.price ? parseFloat(item.price).toLocaleString() : '-'}</td>
                        <td style="text-align: center;"><button class="btn-delete" onclick="deleteData('${item.code}')">✕</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // 🌟 โครงสร้างสำหรับพิมพ์กระดาษ (เลือกได้ว่าจะเอา Table หรือ Grid)
            let printArea = document.getElementById('printArea');
            printArea.innerHTML = "";
            
            if(displayData.length > 0) {
                let columnsStyle = document.getElementById('printColumns').value;
                let fontSize = document.getElementById('fontSize').value;
                let barHeight = document.getElementById('barHeight').value;
                let barWidth = document.getElementById('barWidth').value;

                if (columnsStyle === "table") {
                    // --- วาดแบบตาราง (Table Layout) ---
                    let printTable = document.createElement('table');
                    printTable.className = "print-table";
                    let printTbody = document.createElement('tbody');
                    
                    displayData.forEach((item, index) => {
                        if(!item._printSelected) return;
                        
                        let printDesc = item.desc || "";
                        if(item.model) printDesc += ` (${item.model})`;
                        let priceText = item.price ? parseFloat(item.price).toLocaleString() : "";

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="col-1-barcode"><svg id="bc-${index}"></svg></td>
                            <td class="col-2-code">${item.code || ""}</td>
                            <td class="col-3-desc">${printDesc}</td>
                            <td class="col-4-price">${priceText}</td>
                        `;
                        printTbody.appendChild(tr);
                    });
                    
                    printTable.appendChild(printTbody);
                    printArea.appendChild(printTable);

                } else {
                    // --- วาดแบบการ์ดประหยัดกระดาษ (Grid Layout) ---
                    let printGrid = document.createElement('div');
                    printGrid.className = "print-grid cols-" + columnsStyle;
                    
                    displayData.forEach((item, index) => {
                        if(!item._printSelected) return;

                        let printDesc = item.desc || "";
                        if(item.model) printDesc += ` (${item.model})`;
                        let priceText = item.price ? parseFloat(item.price).toLocaleString() + " ฿" : "";

                        let card = document.createElement('div');
                        card.className = "print-card";
                        card.innerHTML = `
                            <svg id="bc-${index}"></svg>
                            <div class="print-desc">${printDesc}</div>
                            <div class="print-price">${priceText}</div>
                        `;
                        printGrid.appendChild(card);
                    });
                    
                    printArea.appendChild(printGrid);
                }

                // 🌟 สร้างบาร์โค้ดลงใน Layout ที่วาดเสร็จแล้ว
                displayData.forEach((item, index) => {
                    if(!item._printSelected) return;
                    let barcodeValue = String(item.code || "-"); 
                    JsBarcode("#bc-" + index, barcodeValue, { 
                        format: "CODE128", 
                        width: parseFloat(barWidth),
                        height: parseInt(barHeight), 
                        displayValue: true, 
                        fontSize: parseInt(fontSize), 
                        fontOptions: "bold",
                        margin: 15,
                        background: "#ffffff",
                        lineColor: "#000000"
                    });
                });
            }
        }

        function togglePrintRow(code, index, isChecked) {
            let item = barcodeData.find(i => i.code === code);
            if (item) item._printSelected = isChecked;
            renderTable(); // สั่งให้วาดใหม่ทั้งหมดเพื่อป้องกัน Layout พังเวลาสลับไปมา
        }

        function toggleAllPrintRows(isChecked) {
            let currentDisplayCodes = Array.from(document.querySelectorAll('.print-row-cb')).map(cb => cb.getAttribute('data-code'));
            
            barcodeData.forEach(item => {
                if (currentDisplayCodes.includes(item.code)) {
                    item._printSelected = isChecked;
                }
            });
            renderTable();
        }

        function updateSettings() {
            document.getElementById('widthVal').innerText = parseFloat(document.getElementById('barWidth').value).toFixed(1);
            document.getElementById('fontVal').innerText = document.getElementById('fontSize').value;
            document.getElementById('heightVal').innerText = document.getElementById('barHeight').value;
            renderTable();
        }
        
        function deleteData(codeId) {
            if(!confirm(`ต้องการลบรหัส ${codeId} ออกจากฐานข้อมูลใช่หรือไม่?`)) return;
            
            barcodeData = barcodeData.filter(item => item.code !== codeId);
            renderTable();

            let url = typeof window.WEB_APP_URL !== 'undefined' ? window.WEB_APP_URL : WEB_APP_URL;
            fetch(url, {
                method: "POST",
                body: JSON.stringify({ action: "deleteBarcode", code: codeId }),
                redirect: 'follow'
            }).then(() => {
                forceRefresh();
            }).catch(err => alert("ลบข้อมูลผิดพลาด กรุณาลองใหม่"));
        }
    </script>
</body>
</html>
