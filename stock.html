<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต๊อก Apple Parts (Admin)</title>
    <style>
        /* ตั้งค่าธีม Dark Mode และสี Lime Green (ccff00) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 {
            color: #ccff00;
            margin-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }
        .panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        input, select, button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ccff00;
        }
        button {
            background-color: #ccff00;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #b3e600;
            transform: scale(1.02);
        }
        button.delete-btn {
            background-color: #ff4444;
            color: #fff;
            padding: 6px 12px;
            font-size: 14px;
        }
        button.delete-btn:hover {
            background-color: #cc0000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #1a1a1a;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
            color: #ccff00;
        }
        tbody tr:hover {
            background-color: #252525;
        }
        /* ไฮไลท์แถว Footer สรุปยอด */
        tfoot td {
            font-weight: bold;
            font-size: 16px;
            background-color: #2a2a2a;
            color: #ccff00;
            border-top: 2px solid #ccff00;
        }
        .text-right {
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- แถบด้านบน: ชื่อระบบ และ ตัวกรองสาขา (Admin) -->
    <div class="top-bar">
        <h1>📦 Apple Parts Inventory</h1>
        <div>
            <label style="font-weight: bold; margin-right: 10px;">กรองข้อมูล (Admin):</label>
            <select id="adminBranchFilter" onchange="renderAll()">
                <option value="all">ดูภาพรวมทุกสาขา</option>
                <option value="branch_1">สาขา 1</option>
                <option value="branch_2">สาขา 2</option>
                <option value="branch_3">สาขา 3</option>
                <option value="branch_4">สาขา 4</option>
                <option value="branch_5">สาขา 5</option>
                <option value="branch_6">สาขา 6</option>
                <option value="branch_7">สาขา 7</option>
                <option value="branch_8">สาขา 8</option>
            </select>
        </div>
    </div>

    <!-- ส่วนที่ 1: สำหรับยิงรับเข้า / เบิกออก -->
    <div class="panel">
        <h2>สแกนบาร์โค้ด / รับเข้า-เบิกออก</h2>
        <div class="input-group">
            <select id="txBranch">
                <option value="branch_1">สาขา 1</option>
                <option value="branch_2">สาขา 2</option>
            </select>
            <input type="text" id="skuInput" placeholder="สแกน SKU ที่นี่..." style="flex-grow: 1;" autofocus>
            <select id="txType">
                <option value="in">📥 รับเข้า (In)</option>
                <option value="out">📤 เบิกออก (Out)</option>
            </select>
            <input type="number" id="qtyInput" value="1" min="1" style="width: 80px;" title="จำนวน">
            <button onclick="handleScan()">บันทึกรายการ</button>
        </div>
    </div>

    <!-- ส่วนที่ 2: ตารางแสดงสต๊อกคงเหลือ และ Footer สรุปยอด -->
    <div class="panel">
        <h2>สต๊อกคงเหลือ</h2>
        <table>
            <thead>
                <tr>
                    <th>สาขา</th>
                    <th>Part SKU</th>
                    <th class="text-right">จำนวนคงเหลือ (ชิ้น)</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <!-- ข้อมูลจะถูก render ที่นี่ -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" class="text-right">รวมสต๊อกคงเหลือทั้งหมด:</td>
                    <td id="footerTotalStock" class="text-right">0</td>
                </tr>
                <tr>
                    <td colspan="2" class="text-right" style="color: #00ff00;">ยอดรับเข้าทั้งหมดของวันนี้:</td>
                    <td id="footerTotalImport" class="text-right" style="color: #00ff00;">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- ส่วนที่ 3: ประวัติการยิง (และปุ่มลบรายการที่ผิดพลาด) -->
    <div class="panel">
        <h2>ประวัติการสแกนล่าสุด</h2>
        <table>
            <thead>
                <tr>
                    <th>เวลา</th>
                    <th>สาขา</th>
                    <th>Part SKU</th>
                    <th>ประเภท</th>
                    <th class="text-right">จำนวน</th>
                    <th style="text-align: center;">จัดการ</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- ข้อมูลประวัติจะถูก render ที่นี่ -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ตัวแปรจำลองข้อมูล Database (แทน Firebase / D1)
    let transactions = []; 

    // MOCK DATA: จำลองข้อมูลเริ่มต้น
    function initMockData() {
        const todayStr = new Date().toISOString();
        transactions.push({ id: 1, timestamp: todayStr, branch: 'branch_1', sku: '661-12345 (จอ iPhone 11 Pro)', type: 'in', qty: 10, status: 'active' });
        transactions.push({ id: 2, timestamp: todayStr, branch: 'branch_2', sku: '661-12345 (จอ iPhone 11 Pro)', type: 'in', qty: 5, status: 'active' });
        transactions.push({ id: 3, timestamp: todayStr, branch: 'branch_1', sku: '661-98765 (แบต iPhone 15 Pro)', type: 'in', qty: 20, status: 'active' });
    }

    // ฟังก์ชันจัดการเมื่อกด "บันทึกรายการ" หรือ ยิงบาร์โค้ด
    function handleScan() {
        const branch = document.getElementById('txBranch').value;
        const sku = document.getElementById('skuInput').value.trim();
        const type = document.getElementById('txType').value;
        const qty = parseInt(document.getElementById('qtyInput').value);

        if(!sku) return alert("⚠️ กรุณาสแกนหรือพิมพ์ SKU");

        const newTx = {
            id: Date.now(), // ใช้ Time stamp เป็น ID ชั่วคราว
            timestamp: new Date().toISOString(),
            branch: branch,
            sku: sku,
            type: type,
            qty: qty,
            status: 'active'
        };

        // TODO: นำตัวแปร newTx บันทึกลง Cloudflare D1 / Firebase (INSERT)
        transactions.push(newTx);
        
        document.getElementById('skuInput').value = ''; // เคลียร์ช่องสแกน
        document.getElementById('skuInput').focus();
        renderAll();
    }

    // ฟังก์ชันการลบ/Void รายการที่ยิงพลาด (Requirement ข้อ 1)
    function deleteTransaction(id) {
        if(confirm('🗑️ ยืนยันการ "ยกเลิก" รายการนี้หรือไม่?\n(ระบบจะคำนวณจำนวนสต๊อกคืนให้อัตโนมัติ)')) {
            // ค้นหา Transaction และเปลี่ยนสถานะเป็น 'void' 
            // (ไม่แนะนำให้ลบข้อมูลทิ้งถาวร เพื่อให้ Audit กลับมาตรวจสอบได้)
            const index = transactions.findIndex(t => t.id === id);
            if (index !== -1) {
                transactions[index].status = 'void';

                // TODO: อัปเดตสถานะ status='void' ใน Database (UPDATE)
                // TODO: พร้อมกับบวก/ลบสต๊อกที่ Table `stock_summary` กลับคืน

                renderAll();
            }
        }
    }

    // ฟังก์ชันรันข้อมูลใหม่ทั้งหมดลงตาราง
    function renderAll() {
        renderHistory();
        renderStock();
    }

    // ฟังก์ชันแสดงประวัติ (รองรับการกรองตาม Admin)
    function renderHistory() {
        const adminFilter = document.getElementById('adminBranchFilter').value;
        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = '';

        // 1. ดึงเฉพาะรายการที่ไม่ถูกลบ (active)
        let displayTx = transactions.filter(t => t.status === 'active');
        
        // 2. ถ้า Admin เลือกดูสาขาใดสาขาหนึ่ง ให้กรองข้อมูล (Requirement ข้อ 3)
        if (adminFilter !== 'all') {
            displayTx = displayTx.filter(t => t.branch === adminFilter);
        }

        // เรียงเอาล่าสุดขึ้นก่อน
        displayTx.sort((a,b) => b.id - a.id);

        displayTx.forEach(tx => {
            const dateStr = new Date(tx.timestamp).toLocaleString('th-TH');
            const typeText = tx.type === 'in' ? '<span style="color: #00ff00;">📥 รับเข้า</span>' : '<span style="color: #ff9900;">📤 เบิกออก</span>';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dateStr}</td>
                <td>${tx.branch}</td>
                <td>${tx.sku}</td>
                <td>${typeText}</td>
                <td class="text-right">${tx.qty}</td>
                <td style="text-align: center;">
                    <button class="delete-btn" onclick="deleteTransaction(${tx.id})">ลบ</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ฟังก์ชันคำนวณสต๊อกคงเหลือและอัปเดต Footer (Requirement ข้อ 2)
    function renderStock() {
        const adminFilter = document.getElementById('adminBranchFilter').value;
        const tbody = document.getElementById('stockTableBody');
        tbody.innerHTML = '';

        let stockMap = {}; // ตัวแปรพักข้อมูลจัดกลุ่ม SKU
        let totalStockAmount = 0;
        let totalImportTodayAmount = 0;

        const todayStr = new Date().toLocaleDateString('th-TH'); // หาวันที่ของวันนี้

        // วนลูปคำนวณสต๊อกจาก Transaction ทั้งหมด (เฉพาะที่ Active)
        transactions.filter(t => t.status === 'active').forEach(tx => {
            // ถ้า Admin กรองสาขา ข้าม transaction ที่ไม่ตรงสาขาไป
            if (adminFilter !== 'all' && tx.branch !== adminFilter) return;

            // กรณีดูภาพรวมทั้งหมด (all) ให้รวมสต๊อกของทุกสาขาเป็นบรรทัดเดียว
            // แต่ถ้าดูแยกสาขา ให้แยกบรรทัด
            const displayBranch = adminFilter === 'all' ? 'รวมทุกสาขา' : tx.branch;
            const key = displayBranch + "_" + tx.sku;

            if (!stockMap[key]) {
                stockMap[key] = { branch: displayBranch, sku: tx.sku, qty: 0 };
            }

            // คำนวณ บวก/ลบ
            if (tx.type === 'in') {
                stockMap[key].qty += tx.qty;
                
                // เช็คว่า Transaction รับเข้า (In) นี้เป็นของวันนี้หรือไม่
                const txDateStr = new Date(tx.timestamp).toLocaleDateString('th-TH');
                if (txDateStr === todayStr) {
                    totalImportTodayAmount += tx.qty;
                }
            } else if (tx.type === 'out') {
                stockMap[key].qty -= tx.qty;
            }
        });

        // วาดข้อมูลลงตารางสต๊อก
        for (const key in stockMap) {
            const item = stockMap[key];
            totalStockAmount += item.qty;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.branch}</td>
                <td>${item.sku}</td>
                <td class="text-right">${item.qty}</td>
            `;
            tbody.appendChild(tr);
        }

        // อัปเดตตัวเลขรวมที่ Footer ด้านล่างตาราง
        document.getElementById('footerTotalStock').innerText = totalStockAmount.toLocaleString();
        document.getElementById('footerTotalImport').innerText = totalImportTodayAmount.toLocaleString();
    }

    // เมื่อโหลดหน้าเว็บครั้งแรก
    window.onload = () => {
        initMockData();
        renderAll();
    };
</script>

</body>
</html>
